<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Mnemark</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="about-body">
    <div id="about-panel">
      <header class="about-header">
        <h1>Mnemark</h1>
        <p class="version" id="about-version">v—</p>
        <p class="pronunciation">/ˈniː.mɑːrk/ — “NEE-mark”</p>
        <p class="tagline" data-i18n="tagline">Find anything you've copied.（找到任何你複製過的內容。）</p>
      </header>
      <section class="about-story">
        <p data-i18n="nameMeaning">mneme（記憶）+ mark（標記）</p>
        <p data-i18n="brandMeaning">你複製的每一件事都會留下痕跡——Mnemark 讓這些痕跡可被搜尋，讓你能隨時找回曾複製過的內容。</p>
      </section>
      <div class="about-links">
        <a href="https://github.com/LiuTouo/Mnemark" id="link-github">GitHub</a>
        <span> · </span>
        <a href="https://github.com/LiuTouo/Mnemark/blob/main/CHANGELOG.md" id="link-changelog" data-i18n="changelog">更新日誌</a>
      </div>
      <hr />
      <div id="update-section">
        <p id="update-status" class="hint"></p>
        <button id="btn-check-update" data-i18n="checkUpdate">檢查更新</button>
        <button id="btn-install-update" class="hidden" data-i18n="installNow">立即更新</button>
        <button id="btn-restart" class="hidden" data-i18n="restartNow">立即重新啟動</button>
        <button id="btn-open-folder" class="hidden" data-i18n="openFolder">開啟資料夾</button>
      </div>
    </div>
    <script type="module" src="/src/about.ts" defer></script>
  </body>
</html>
