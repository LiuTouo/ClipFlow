<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemark 設定</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="settings-body">
    <div id="settings-panel">
      <header class="settings-header">
        <h1 data-i18n="settings">設定</h1>
        <p class="settings-subtitle" data-i18n="settingsSubtitle">調整 Mnemark 的行為與外觀。</p>
      </header>

      <form id="settings-form" novalidate>
        <div class="settings-scroll">
          <fieldset id="settings-fieldset" class="settings-fieldset" disabled>

            <!-- Hotkey -->
            <section class="settings-card" aria-labelledby="card-header-hotkey">
              <h2 class="settings-card-header" id="card-header-hotkey" data-i18n="hotkey">快捷鍵</h2>
              <div class="settings-row">
                <span class="settings-label" id="label-hotkey" data-i18n="hotkeyLabel">快捷鍵組合</span>
                <input type="text" id="setting-hotkey" value="Ctrl+Shift+V" readonly
                  aria-labelledby="label-hotkey"
                  aria-describedby="hint-hotkey hotkey-error" />
              </div>
              <p class="settings-hint" id="hint-hotkey" data-i18n="hotkeyHint">點擊以變更，按 Esc 取消</p>
              <p id="hotkey-error" class="hotkey-error" role="alert"></p>
            </section>

            <!-- Favorites shortcut -->
            <section class="settings-card" aria-labelledby="card-header-favorites">
              <h2 class="settings-card-header" id="card-header-favorites" data-i18n="favorites">抽屜</h2>
              <div class="settings-row">
                <span class="settings-label" id="label-favorites-shortcut" data-i18n="favoritesToggle">抽屜快捷鍵</span>
                <input type="text" id="setting-favorites-shortcut" value="Alt Left" readonly
                  aria-labelledby="label-favorites-shortcut"
                  aria-describedby="hint-favorites-shortcut favorites-shortcut-error" />
              </div>
              <p class="settings-hint" id="hint-favorites-shortcut" data-i18n="favoritesToggleHint">按下的按鍵組合用於開啟/關閉抽屜</p>
              <p id="favorites-shortcut-error" class="hotkey-error" role="alert"></p>
            </section>

            <!-- Text History -->
            <section class="settings-card" aria-labelledby="card-header-text">
              <h2 class="settings-card-header" id="card-header-text" data-i18n="textHistory">文字歷史</h2>
              <label class="settings-row">
                <span data-i18n="textSizeLimit">單則文字大小上限 (KB)</span>
                <input type="number" id="setting-text-size-limit" min="10" max="10000" required />
              </label>
              <label class="settings-row">
                <span data-i18n="textCountLimit">文字歷史筆數上限</span>
                <input type="number" id="setting-text-count-limit" min="10" max="1000" required />
              </label>
            </section>

            <!-- Image History -->
            <section class="settings-card" aria-labelledby="card-header-image">
              <h2 class="settings-card-header" id="card-header-image" data-i18n="imageHistory">圖片歷史</h2>
              <label class="settings-row">
                <span data-i18n="imageCountLimit">圖片歷史筆數上限</span>
                <input type="number" id="setting-image-count-limit" min="1" max="200" required />
              </label>
              <label class="settings-row">
                <span data-i18n="imageMemoryBudget">圖片記憶體上限 (MB)</span>
                <input type="number" id="setting-image-memory-budget" min="5" max="500" required />
              </label>
              <label class="settings-row">
                <span data-i18n="imageSizeLimit">單張圖片大小上限 (MB)</span>
                <input type="number" id="setting-image-size-limit" min="1" max="100" required />
              </label>
            </section>

            <!-- Behavior -->
            <section class="settings-card" aria-labelledby="card-header-behavior">
              <h2 class="settings-card-header" id="card-header-behavior" data-i18n="behavior">行為</h2>
              <label class="settings-row">
                <span data-i18n="startup">登入時自動啟動（免安裝捷徑）</span>
                <input type="checkbox" id="setting-startup" class="toggle-switch" />
              </label>
              <label class="settings-row">
                <span data-i18n="persist">將歷史紀錄保存到磁碟（SQLite）</span>
                <input type="checkbox" id="setting-persist" class="toggle-switch" />
              </label>
              <label class="settings-row">
                <span data-i18n="vimMode">Vim 模式（以 j/k 瀏覽）</span>
                <input type="checkbox" id="setting-vim-mode" class="toggle-switch" />
              </label>
              <label class="settings-row">
                <span data-i18n="pasteFilesAsFiles">貼上檔案歷史時複製實際檔案</span>
                <input type="checkbox" id="setting-paste-files-as-files" class="toggle-switch"
                  aria-describedby="hint-paste-files-as-files" />
              </label>
              <p class="settings-hint" id="hint-paste-files-as-files" data-i18n="pasteFilesAsFilesHint">開啟時，貼上檔案歷史等同在檔案總管複製該檔案（貼上時來源檔案必須仍存在）；關閉時改貼上路徑文字。</p>
              <label class="settings-row">
                <span data-i18n="autoUpdate">自動檢查更新</span>
                <input type="checkbox" id="setting-auto-update" class="toggle-switch"
                  aria-describedby="hint-auto-update" />
              </label>
              <p class="settings-hint" id="hint-auto-update" data-i18n="autoUpdateHint">安裝版會在背景自動下載並安裝更新；免安裝版請到「關於」頁手動檢查。</p>
              <label class="settings-row">
                <span data-i18n="rememberHistoryFilter">記住歷史記錄過濾器</span>
                <input type="checkbox" id="setting-remember-history-filter" class="toggle-switch"
                  aria-describedby="hint-remember-history-filter" />
              </label>
              <p class="settings-hint" id="hint-remember-history-filter" data-i18n="rememberHistoryFilterHint">關閉時每次開啟面板皆回到「全部」；開啟時在 Mnemark 結束前會記住上次選擇的過濾器。</p>
              <label class="settings-row">
                <span data-i18n="debounce">防抖動 (ms)</span>
                <input type="number" id="setting-debounce" min="50" max="2000" step="50" required />
              </label>
            </section>

            <!-- Appearance -->
            <section class="settings-card" aria-labelledby="card-header-appearance">
              <h2 class="settings-card-header" id="card-header-appearance" data-i18n="appearance">外觀</h2>
              <label class="settings-row">
                <span data-i18n="language">語言</span>
                <select id="setting-language">
                  <option value="zh-TW">繁體中文</option>
                  <option value="en">English</option>
                </select>
              </label>
              <label class="settings-row">
                <span data-i18n="theme">主題</span>
                <select id="setting-theme">
                  <option value="system" data-i18n="themeSystem">跟隨系統</option>
                  <option value="dark" data-i18n="themeDark">深色</option>
                  <option value="light" data-i18n="themeLight">淺色</option>
                </select>
              </label>
              <label class="settings-row settings-range-row">
                <span data-i18n="uiOpacity">UI 不透明度</span>
                <span class="settings-range-control">
                  <input type="range" id="setting-ui-opacity" min="50" max="100" step="1" value="96" />
                  <output id="setting-ui-opacity-value" for="setting-ui-opacity">96%</output>
                </span>
              </label>
            </section>

            <!-- Exclusion List -->
            <section class="settings-card" aria-labelledby="card-header-exclusions">
              <h2 class="settings-card-header" id="card-header-exclusions" data-i18n="exclusionList">排除清單</h2>
              <label class="settings-row settings-textarea-row">
                <span class="sr-only" data-i18n="exclusionList">排除清單</span>
                <textarea id="setting-exclusions" rows="6" aria-describedby="hint-exclusions"
                  placeholder="1Password.exe&#10;Bitwarden.exe&#10;KeePass.exe"></textarea>
              </label>
              <p class="settings-hint" id="hint-exclusions" data-i18n="exclusionHint">執行檔名稱（每行一個）。來自這些應用程式的剪貼簿內容不會被記錄。</p>
            </section>

          </fieldset>
        </div>

        <div class="settings-actions">
          <div id="settings-status" class="settings-status" role="status" aria-live="polite"></div>
          <div class="settings-actions-buttons">
            <button type="submit" id="btn-save" class="btn-primary" data-i18n="save" disabled>儲存</button>
            <button type="button" id="btn-cancel" data-i18n="cancel">取消</button>
          </div>
        </div>
      </form>
    </div>
    <script type="module" src="/src/settings.ts" defer></script>
  </body>
</html>
